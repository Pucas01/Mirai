font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

shell fish

window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

background_opacity 0.92
dynamic_background_opacity yes

cursor_shape beam
cursor_blink_interval 0.6
cursor_trail 1

scrollback_lines 10000

tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top
tab_bar_min_tabs 1
active_tab_font_style   bold
inactive_tab_font_style normal

# Mirai / Quickshell bar palette
foreground            #d0d0d0
background            #1a1a1a
selection_foreground  #1a1a1a
selection_background  #39c5bb

cursor                #39c5bb
cursor_text_color     #1a1a1a

url_color #39c5bb

active_border_color   #39c5bb
inactive_border_color #2a2a2a

active_tab_foreground   #ffffff
active_tab_background   #2a8a8a
inactive_tab_foreground #999999
inactive_tab_background #242424
tab_bar_background      #161616

